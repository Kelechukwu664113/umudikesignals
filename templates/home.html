{% extends "base.html" %}

{% block content %}
<input
    type="text"
    id="location-search"
    placeholder="Search a location"
    class="w-full border rounded-lg px-4 py-3 mb-4"
    onkeyup="filterLocations()"
>

<div id="location-list" class="flex flex-col">
    {% for location in locations %}
    <a href="{% url 'location_detail' location.id %}"
       class="location-item flex justify-between items-center py-3 border-b">
        <span>{{ location.name }}</span>
        <span class="text-gray-400">&rarr;</span>
    </a>
    {% empty %}
    <p class="text-gray-500">No locations yet.</p>
    {% endfor %}
</div>

<script>
function filterLocations() {
    const query = document.getElementById('location-search').value.toLowerCase();
    document.querySelectorAll('.location-item').forEach(function(item) {
        const name = item.querySelector('span').textContent.toLowerCase();
        item.style.display = name.includes(query) ? 'flex' : 'none';
    });
}
</script>

<a href="{% url 'suggest_location' %}" class="block text-center text-sm text-green-700 mt-4">Can't find your location? Suggest one</a>
{% endblock %}
